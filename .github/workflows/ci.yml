name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go test -fuzz=FuzzParsePairingToken -fuzztime=60s ./internal/auth
      - run: go test -fuzz=FuzzParseAuthSecret -fuzztime=60s ./internal/auth
      - run: go test -fuzz=FuzzParseID -fuzztime=60s ./internal/ids
      - run: go test -fuzz=FuzzConfigLoad -fuzztime=60s ./internal/config
      - run: |
          set -eu
          image=kynotes-server:ci
          docker build -t "$image" .
          auth='{"authSecret":"b9eb85992f985b432a3feaf4f5ea0b7b7960a5da42c640a3b9d93a83fc5bef1d","loginSalt":"MDEyMzQ1Njc4OWFiY2RlZg==","iterations":100000}'
          printf '%s' "$auth" | docker run -i --rm --user "$(id -u):$(id -g)" -v "$PWD/testdata/config-good:/data" "$image" user add --config /data/kynotes.yaml --username probe
          docker run -d --name kynotes-probe-server --user "$(id -u):$(id -g)" -p 8080:8080 -v "$PWD/testdata/config-good:/data" "$image" --config /data/kynotes.yaml
          trap 'docker rm -f kynotes-probe-server >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then ready=1; break; fi; sleep 1; done
          test "$ready" -eq 1
          go run ./cmd/kynotes-probe -url http://127.0.0.1:8080 -username probe -password 'correct horse battery staple' -config /data/kynotes.yaml -server docker
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

  # Publishes the image only after every job above has passed, and only for
  # pushes to master: a pull request from a fork must never write a package.
  publish:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Derived, not spelled out: GITHUB_TOKEN can only write the owning
      # account's namespace, and registries reject a mixed-case name.
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # The commit tag is what lets an operator pin a known-good image and
      # roll back to it; :latest alone gives them nowhere to go.
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
