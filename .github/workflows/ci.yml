name: verify
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.6'
      - run: go build ./...
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)"
      - run: go test -race ./...
      - run: go test -fuzz=FuzzParsePairingToken -fuzztime=60s ./internal/auth
      - run: go test -fuzz=FuzzParseAuthSecret -fuzztime=60s ./internal/auth
      - run: go test -fuzz=FuzzParseID -fuzztime=60s ./internal/ids
      - run: go test -fuzz=FuzzConfigLoad -fuzztime=60s ./internal/config
      - run: |
          set -eu
          image=kynotes-server:ci
          docker build -t "$image" .
          auth='{"authSecret":"b9eb85992f985b432a3feaf4f5ea0b7b7960a5da42c640a3b9d93a83fc5bef1d","loginSalt":"MDEyMzQ1Njc4OWFiY2RlZg==","iterations":100000}'
          printf '%s' "$auth" | docker run -i --rm --user "$(id -u):$(id -g)" -v "$PWD/testdata/config-good:/data" "$image" user add --config /data/kynotes.yaml --username probe
          docker run -d --name kynotes-probe-server --user "$(id -u):$(id -g)" -p 8080:8080 -v "$PWD/testdata/config-good:/data" "$image" --config /data/kynotes.yaml
          trap 'docker rm -f kynotes-probe-server >/dev/null 2>&1 || true' EXIT
          ready=0
          for i in $(seq 1 30); do if curl -fsS http://127.0.0.1:8080/healthz >/dev/null; then ready=1; break; fi; sleep 1; done
          test "$ready" -eq 1
          go run ./cmd/kynotes-probe -url http://127.0.0.1:8080 -username probe -password 'correct horse battery staple' -config /data/kynotes.yaml -server docker
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...

      # Hand the exact image the checks above ran against to the publish job,
      # so what gets pushed is what was tested, never a second build.
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: docker save kynotes-server:ci | gzip > tested-image.tar.gz
      - if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tested-image
          path: tested-image.tar.gz
          retention-days: 1

  # Publishes the image CI tested: only for pushes to master, only
  # after every job passed, and with no checkout and no build of its own, so
  # the pushed bytes are the tested bytes. A pull request from a fork must
  # never reach this job or write a package.
  publish:
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    # One publish at a time, never cancelled: a run that has pushed :<sha> must
    # be allowed to finish attesting it. Ordering is handled below, not here.
    concurrency:
      group: publish-master
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: tested-image
      - run: docker load < tested-image.tar.gz

      - env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      # Name derived, not spelled out: GITHUB_TOKEN can only write the owning
      # account's namespace, and registries reject a mixed-case name. The commit
      # tag is what lets an operator pin a known-good image and roll back to it;
      # :latest alone gives them nowhere to go.
      - id: push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag kynotes-server:ci "$name:$GITHUB_SHA"
          docker tag kynotes-server:ci "$name:latest"
          docker push "$name:$GITHUB_SHA"
          digest="$(docker buildx imagetools inspect "$name:$GITHUB_SHA" --format '{{.Manifest.Digest}}')"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          # :latest moves only to the current tip of master. Two runs are
          # serialised but not ordered, so a slower run for an older commit
          # would otherwise move :latest backwards. The :<sha> tag above and
          # the attestation below are unconditional.
          tip="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq .commit.sha)"
          if [ "$tip" = "$GITHUB_SHA" ]; then
            docker push "$name:latest"
            echo "Published \`$name@$digest\` as \`:latest\` and \`:$GITHUB_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Published \`$name@$digest\` as \`:$GITHUB_SHA\` only: master has moved on to $tip" >> "$GITHUB_STEP_SUMMARY"
          fi

      # Binds the pushed manifest to this run and commit. Verifying it here, the
      # way an operator would, proves the attestation is usable and not just present.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NAME: ${{ steps.push.outputs.name }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: gh attestation verify "oci://$NAME@$DIGEST" --repo "$GITHUB_REPOSITORY"
