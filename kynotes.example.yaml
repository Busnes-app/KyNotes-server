server:
  bind: "0.0.0.0:8080"
  behind_proxy: true
  trusted_proxies: ["127.0.0.1/32"]
  read_header_timeout: "10s"
  read_timeout: "60s"
  write_timeout: "120s"
  idle_timeout: "120s"
  shutdown_grace: "20s"
  max_request_bytes: 1048576
  dev_insecure_cookies: false
data_dir: "/data"
secrets:
  pairing_secret: ""
  server_salt_key: ""
limits:
  attachment_max_bytes: 26214400
  chunk_bytes: 4194304
  object_max_bytes: 10485760
  upload_session_ttl: "15m"
  user_quota_bytes: 1073741824
  team_quota_bytes: 5368709120
gc:
  enabled: true
  retention: "168h"
  interval: "1h"
ratelimit:
  login_per_minute: 10 # also browser link-relay steps (claim, reveal, approve, cancel), per account
  pairing_per_hour: 20 # device pairing tokens and browser link requests, per account
  upload_per_minute: 60
  invitation_per_hour: 30 # invitation creation; accepts get their own bucket at this rate
  link_poll_per_minute: 60 # browser link collect polls (every 2 s), per account
log:
  level: "info"
  format: "json"
backup:
  dir: ""                        # local directory for sealed .kycap copies; empty disables
  keep: 7                        # newest N local copies kept
  deposit_interval: "24h"        # default schedule; "0" disables; floor 15m; the admin UI setting overrides
  allow_private_recovery: false  # admit a KyRecovery on a private or CGNAT address (HTTPS still required)
  blob_target:
    url: ""                     # file:///mnt/backup/blobs, s3://bucket/prefix, sftp://user@host/path, smb://host/share/path
    access_key: ""              # S3 key ID or SFTP/SMB user; never put passwords in URLs
    secret: ""                  # S3 secret, SFTP password/private PEM key, SMB password
    host_key: ""                # verified SFTP SHA256 fingerprint (required for SFTP)
    s3_endpoint: ""             # optional S3-compatible endpoint
    s3_region: "us-east-1"
