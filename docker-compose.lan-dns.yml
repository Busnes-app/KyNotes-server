# Optional override: send the container's DNS lookups to your LAN resolver so a
# KyRecovery that exists only there resolves inside the container. A dns: entry
# replaces the host's resolvers for every lookup this container makes, which is
# why it lives in its own file and never in docker-compose.yml.
#
# Select it by appending it to COMPOSE_FILE in .env, never with -f: an explicit -f list
# replaces COMPOSE_FILE outright and would drop the build overlay of a source install.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.lan-dns.yml            (published image)
#   COMPOSE_FILE=docker-compose.yml:docker-compose.build.yml:docker-compose.lan-dns.yml   (source)
#   KYNOTES_DNS=192.168.1.1 docker compose up -d --force-recreate
services:
  kynotes-server:
    dns:
      - ${KYNOTES_DNS:?set KYNOTES_DNS to your LAN DNS server}
